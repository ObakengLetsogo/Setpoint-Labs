<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:U;src:url(Urbanist.ttf)}
*{box-sizing:border-box;margin:0}body{width:1920px;height:1080px;overflow:hidden;background:#FAF8F3;font-family:U,sans-serif;color:#1B2430}
#bg{position:absolute;inset:0;background-image:linear-gradient(#ECE7DC 1px,transparent 1px),linear-gradient(90deg,#ECE7DC 1px,transparent 1px);background-size:48px 48px;opacity:.55}
#stage{position:absolute;inset:0}
.top{position:absolute;left:96px;top:64px;display:flex;align-items:center;gap:18px;font-weight:700;letter-spacing:6px;font-size:22px;color:#6B6F76}
.cap{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);max-width:1500px;text-align:center;font-size:30px;font-weight:600;line-height:1.35;color:#1B2430;background:rgba(255,253,249,.92);border:1px solid #E6E2D9;border-radius:16px;padding:14px 28px}
.k{font-size:24px;font-weight:700;letter-spacing:8px;color:#F26B1D}
h1{font-size:120px;font-weight:900;line-height:1}h2{font-size:76px;font-weight:800;line-height:1.05}
.card{background:#FFFDF9;border:2px solid #E6E2D9;border-radius:22px;box-shadow:0 10px 30px rgba(27,36,48,.06)}
.code{position:absolute;right:96px;top:64px;font-weight:700;font-size:22px;letter-spacing:4px;color:#6B6F76}
</style></head><body><div id="bg"></div><div id="stage"></div><div class="code">FOUNDATION · INTRODUCTION</div><div class="cap" id="cap"></div>
<script>
const N='#1B2430',O='#F26B1D',G='#2E9E5B',M='#6B6F76',B='#E6E2D9';
const mark=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><line x1="6" y1="40" x2="94" y2="40" stroke="${O}" stroke-width="5" stroke-linecap="round"/><path d="M6 84 L22 84 C30 84 32 22 44 22 C54 22 56 48 64 46 C70 44 72 40 80 40" fill="none" stroke="${N}" stroke-width="7" stroke-linecap="round"/><circle cx="84" cy="40" r="7" fill="${O}"/></svg>`;
const cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const ap=(t,s,d=.8)=>e((t-s)/d);
const fx=(t,s,y=30)=>{const a=ap(t,s);return `opacity:${a};transform:translateY(${(1-a)*y}px)`};
const S={};
S.title=(t)=>{const L=ap(t,.3,2.2);return `<div style="position:absolute;left:0;right:0;top:250px;text-align:center">
<svg width="260" height="260" viewBox="0 0 100 100"><line x1="6" y1="40" x2="94" y2="40" stroke="${O}" stroke-width="5" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="${90*(1-ap(t,.2,1))}"/><path d="M6 84 L22 84 C30 84 32 22 44 22 C54 22 56 48 64 46 C70 44 72 40 80 40" fill="none" stroke="${N}" stroke-width="7" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="${160*(1-L)}"/><circle cx="84" cy="40" r="${7*ap(t,2.4,.5)}" fill="${O}"/></svg>
<h1 style="${fx(t,2.6)};margin-top:20px">SETPOINT <span style="color:${O}">LABS</span></h1>
<div style="${fx(t,3.6)};margin-top:30px;font-size:40px;font-weight:600;color:${M}">Foundation Level · Course Introduction</div></div>`};
S.why=(t)=>{const items=[['⛏','Mines'],['🏭','Factories'],['🍾','Bottling plants'],['💧','Water works']];
const belt=(t*60)%120;
return `<div style="position:absolute;left:120px;top:190px"><div class="k" style="${fx(t,.2)}">WHY IT MATTERS</div><h2 style="${fx(t,.6)};margin-top:16px">Industry runs on<br><span style="color:${O}">controllers</span></h2>
<div style="display:flex;gap:22px;margin-top:50px">${items.map((x,i)=>`<div class="card" style="${fx(t,1.5+i*1)};width:190px;padding:26px;text-align:center"><div style="font-size:60px">${x[0]}</div><div style="font-size:26px;font-weight:700;margin-top:10px">${x[1]}</div></div>`).join('')}</div></div>
<div class="card" style="position:absolute;right:120px;top:220px;width:760px;height:520px;${fx(t,6)}">
<svg width="760" height="520"><rect x="60" y="300" width="640" height="40" rx="20" fill="#D9D4C8"/>
${[0,1,2,3,4,5,6].map(i=>`<rect x="${60+((i*120+belt)%640)}" y="250" width="60" height="50" rx="8" fill="${i%2?O:'#2457A6'}"/>`).join('')}
<circle cx="80" cy="320" r="26" fill="${N}"/><circle cx="680" cy="320" r="26" fill="${N}"/>
<rect x="290" y="70" width="180" height="110" rx="14" fill="${N}"/><text x="380" y="135" fill="#fff" font-size="34" font-weight="800" text-anchor="middle" font-family="U">PLC</text>
<circle cx="320" cy="160" r="7" fill="${G}" opacity="${(Math.floor(t*2)%2)?1:.3}"/><circle cx="345" cy="160" r="7" fill="${G}" opacity="${(Math.floor(t*2+1)%2)?1:.3}"/>
<path d="M380 180 L380 240" stroke="${M}" stroke-width="4" stroke-dasharray="8 8"/>
<text x="380" y="420" text-anchor="middle" font-size="28" font-weight="700" fill="${M}" font-family="U" opacity="${ap(t,14)}">A small computer watching and deciding</text>
<text x="380" y="465" text-anchor="middle" font-size="32" font-weight="800" fill="${O}" font-family="U" opacity="${ap(t,19)}">Skilled people are scarce</text></svg></div>`};
S.scan=(t,d)=>{const ph=t<4?-1:Math.floor(((t-4)/2.4))%3;const steps=[['1','READ INPUTS','Buttons, sensors'],['2','RUN PROGRAM','Top to bottom'],['3','WRITE OUTPUTS','Contactors, valves, lights']];
const ang=t<4?0:((t-4)/7.2)*360;
return `<div style="position:absolute;left:120px;top:150px"><div class="k" style="${fx(t,.2)}">HOW A PLC THINKS</div><h2 style="${fx(t,.6)};margin-top:16px">The <span style="color:${O}">scan</span> cycle</h2></div>
<div style="position:absolute;left:120px;top:420px;display:flex;flex-direction:column;gap:26px">${steps.map((s,i)=>`<div class="card" style="${fx(t,2+i*1.2)};width:640px;padding:26px 32px;display:flex;gap:26px;align-items:center;border-color:${ph===i?O:B};background:${ph===i?'#FFF4EC':'#FFFDF9'}"><div style="width:64px;height:64px;border-radius:50%;background:${ph===i?O:N};color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center">${s[0]}</div><div><div style="font-size:34px;font-weight:800;letter-spacing:2px">${s[1]}</div><div style="font-size:26px;color:${M};margin-top:4px">${s[2]}</div></div></div>`).join('')}</div>
<svg style="position:absolute;right:220px;top:290px;${fx(t,3)}" width="560" height="560" viewBox="0 0 560 560"><circle cx="280" cy="280" r="220" fill="none" stroke="${B}" stroke-width="22"/>
<circle cx="280" cy="280" r="220" fill="none" stroke="${O}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${2*Math.PI*220}" stroke-dashoffset="${2*Math.PI*220*(1-((ang%360)/360))}" transform="rotate(-90 280 280)"/>
<text x="280" y="270" text-anchor="middle" font-family="U" font-size="64" font-weight="900" fill="${N}">SCAN</text><text x="280" y="330" text-anchor="middle" font-family="U" font-size="30" font-weight="600" fill="${M}">${t<4?'':'#'+(Math.floor(ang/360)+1)} · about 10 ms</text></svg>`};
S.ladder=(t)=>{const C=CUES.ladder,p=C[2][0]+1.2,q=C[4][0]+0.8;const start=t>p&&t<p+3, run=t>p&&t<q, stopP=t>=q&&t<q+2.5;
const g=(on)=>on?G:N, w=(on)=>on?7:4;
const r1=run, startClosed=start, sealOn=run;
return `<div style="position:absolute;left:120px;top:140px"><div class="k" style="${fx(t,.2)}">THE LANGUAGE</div><h2 style="${fx(t,.6)};margin-top:16px">Ladder logic: the <span style="color:${O}">seal in</span></h2></div>
<div class="card" style="position:absolute;left:120px;right:120px;top:400px;height:470px;${fx(t,3)}"><svg width="1680" height="470" font-family="U">
<line x1="120" y1="40" x2="120" y2="430" stroke="${N}" stroke-width="8"/><line x1="1560" y1="40" x2="1560" y2="430" stroke="${N}" stroke-width="8"/>
<text x="120" y="30" text-anchor="middle" font-size="22" fill="${M}">L+</text><text x="1560" y="30" text-anchor="middle" font-size="22" fill="${M}">0V</text>
<line x1="120" y1="160" x2="380" y2="160" stroke="${g(start||sealOn)}" stroke-width="${w(start||sealOn)}"/>
<line x1="380" y1="125" x2="380" y2="195" stroke="${g(startClosed)}" stroke-width="7"/><line x1="420" y1="125" x2="420" y2="195" stroke="${g(startClosed)}" stroke-width="7"/>
<text x="400" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="${N}">START</text><text x="400" y="100" text-anchor="middle" font-size="22" fill="${M}">I0.0</text>
<line x1="420" y1="160" x2="760" y2="160" stroke="${g(run)}" stroke-width="${w(run)}"/>
<line x1="760" y1="125" x2="760" y2="195" stroke="${g(run)}" stroke-width="7"/><line x1="800" y1="125" x2="800" y2="195" stroke="${g(run)}" stroke-width="7"/><line x1="745" y1="200" x2="815" y2="120" stroke="${stopP?O:g(run)}" stroke-width="6"/>
<text x="780" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="${stopP?O:N}">STOP</text><text x="780" y="100" text-anchor="middle" font-size="22" fill="${M}">I0.1</text>
<line x1="800" y1="160" x2="1200" y2="160" stroke="${g(run)}" stroke-width="${w(run)}"/>
<path d="M1215 120 Q1195 160 1215 200 M1285 120 Q1305 160 1285 200" fill="none" stroke="${g(run)}" stroke-width="7"/>
<text x="1250" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="${N}">MOTOR</text><text x="1250" y="100" text-anchor="middle" font-size="22" fill="${M}">Q0.0</text>
<line x1="1300" y1="160" x2="1560" y2="160" stroke="${g(run)}" stroke-width="${w(run)}"/>
<g opacity="${ap(t,CUES.ladder[3][0],.8)}"><line x1="240" y1="160" x2="240" y2="340" stroke="${g(sealOn)}" stroke-width="${w(sealOn)}"/><line x1="240" y1="340" x2="380" y2="340" stroke="${g(sealOn)}" stroke-width="${w(sealOn)}"/>
<line x1="380" y1="305" x2="380" y2="375" stroke="${g(sealOn)}" stroke-width="7"/><line x1="420" y1="305" x2="420" y2="375" stroke="${g(sealOn)}" stroke-width="7"/>
<line x1="420" y1="340" x2="560" y2="340" stroke="${g(sealOn)}" stroke-width="${w(sealOn)}"/><line x1="560" y1="340" x2="560" y2="160" stroke="${g(sealOn)}" stroke-width="${w(sealOn)}"/>
<text x="400" y="420" text-anchor="middle" font-size="28" font-weight="800" fill="${O}">MOTOR (seal in)</text></g>
<g transform="translate(1440 330)"><circle r="56" fill="#F1EEE7" stroke="${N}" stroke-width="5"/>${[0,120,240].map(a=>`<rect x="-6" y="-48" width="12" height="40" rx="6" fill="${run?O:M}" transform="rotate(${a+(run?(t-p)*240:0)})"/>`).join('')}<circle r="10" fill="${N}"/></g>
<text x="1440" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="${run?G:M}">${run?'RUNNING':'STOPPED'}</text>
</svg></div>`};
const list=(t,arr,cols,st,gap=1.05)=>`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:14px;margin-top:30px">${arr.map((x,i)=>`<div class="card" style="${fx(t,st+i*gap)};padding:16px 26px;display:flex;gap:20px;align-items:center"><div style="font-size:30px;font-weight:900;color:${O};min-width:52px">${String(i+1).padStart(2,'0')}</div><div style="font-size:31px;font-weight:700">${x}</div></div>`).join('')}</div>`;
const MODS={stage1a:{k:'STAGE 1 · FUNDAMENTALS AND SCADA',h:'Stage 1 · modules <span style="color:#F26B1D">1 to 5</span>',n:0,m:[['What a PLC is','Why machines need controllers · inside the PLC · inputs, outputs and the scan'],['Ladder logic basics','Ladder symbols · contacts and coils · latch and unlatch'],['Numbers, data and tags','Bits, bytes and words · data types · tags, addresses and memory'],['Motor control','The seal in circuit · overload protection · jog and run'],['Field devices','Buttons and limit switches · proximity and photoelectric sensors · relays, contactors and solenoid valves']]},
stage1b:{k:'STAGE 1 · FUNDAMENTALS AND SCADA',h:'Stage 1 · modules <span style="color:#F26B1D">6 to 10</span>',n:5,off:0,m:[['Timers','On delay and off delay timers · pilot lamps and alarms'],['Counters, edges and comparisons','Counters · edge detection · comparisons and maths'],['Safety basics','E stop circuits · safe stop design'],['Pneumatics basics','Compressed air and cylinders · solenoid valves and cylinder sequences'],['HMI and SCADA first look','What HMI and SCADA are · your first operator screen · alarms and trends']]},
stage2:{k:'STAGE 2 · 4 MODULES · 14 LECTURES',h:'Installation and <span style="color:#F26B1D">Commissioning</span>',n:0,m:[['Drawings','Reading a schematic · power and control circuits · panel layout and terminal numbering'],['Electrical safety at work','Isolation, lockout and testing for dead · protection and earthing · cables, glands and wiring standards'],['Wiring and testing','Wiring PLC inputs and outputs · testing with a multimeter · I/O loop checks'],['Software and commissioning','Download and online monitoring · commissioning checklist · fault finding · backups and change control']]}};
const modScene=(key)=>(t)=>{const M=MODS[key],c=CUES[key],first=key==='stage1b'?0:1;
return `<div style="position:absolute;left:120px;right:120px;top:96px"><div class="k" style="${fx(t,.2)}">${M.k}</div><h2 style="${fx(t,.6)};margin-top:8px;font-size:64px">${M.h}</h2>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:30px">${M.m.map((x,i)=>{const st=c[i+first][0],en=c[i+first+1]?c[i+first+1][0]:999,now=t>=st&&t<en;return `<div class="card" style="${fx(t,st)};height:116px;padding:0 32px;display:flex;gap:28px;align-items:center;border-color:${now?O:B};background:${now?'#FFF4EC':'#FFFDF9'}"><div style="font-size:40px;font-weight:900;color:${O};min-width:64px">${String(M.n+i+1).padStart(2,'0')}</div><div><div style="font-size:36px;font-weight:800">${x[0]}</div><div style="font-size:25px;color:${M_};margin-top:4px">${x[1]}</div></div></div>`}).join('')}</div></div>`};
const M_='#6B6F76';S.stage1a=modScene('stage1a');S.stage1b=modScene('stage1b');S.stage2=modScene('stage2');
S.format=(t)=>{const f=[['Why it matters',0],['Theory with drawings',3.5],['Meet the parts in 3D',6],['Build the logic',8.5],['Run it',10],['Find the faults',11.5],['On real controllers',15],['Lab and quiz',21]];
return `<div style="position:absolute;left:120px;right:120px;top:130px"><div class="k" style="${fx(t,.2)}">HOW EVERY LECTURE WORKS</div><h2 style="${fx(t,.6)};margin-top:12px">One steady <span style="color:${O}">pattern</span></h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:60px">${f.map((x,i)=>{const now=t>=x[1]+1.5&&(i==7||t<f[i+1][1]+1.5);return `<div class="card" style="${fx(t,x[1]+1.5)};padding:30px;min-height:200px;border-color:${now?O:B};background:${now?'#FFF4EC':'#FFFDF9'}"><div style="font-size:30px;font-weight:900;color:${O}">${i+1}</div><div style="font-size:36px;font-weight:800;margin-top:14px;line-height:1.15">${x[0]}</div>${i==6?`<div style="font-size:22px;color:${M};margin-top:12px">Siemens S7 1200 · Allen Bradley CompactLogix</div>`:''}</div>`}).join('')}</div></div>`};
S.outcome=(t)=>{const o=['How a PLC controls a machine','Read and write ladder logic','Read electrical drawings','Wire and test I/O','Commission a simple machine safely'];
return `<div style="position:absolute;left:120px;top:150px;width:860px"><div class="k" style="${fx(t,.2)}">BY THE END</div><h2 style="${fx(t,.6)};margin-top:12px">You will be able to</h2>
<div style="margin-top:40px;display:flex;flex-direction:column;gap:18px">${o.map((x,i)=>`<div style="${fx(t,2+i*1.6)};display:flex;gap:18px;align-items:center;font-size:36px;font-weight:700"><span style="width:44px;height:44px;border-radius:50%;background:${G};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px">✓</span>${x}</div>`).join('')}</div></div>
<div class="card" style="position:absolute;right:120px;top:220px;width:720px;padding:44px;${fx(t,10.5)}"><div class="k">FOUNDATION EXAM</div>
<div style="display:flex;gap:24px;margin-top:28px">${[['60','min theory','40 questions'],['90','min practical','motor starter and conveyor']].map((x,i)=>`<div style="flex:1;${fx(t,11.5+i*2.5)}"><div style="font-size:96px;font-weight:900;color:${N}">${x[0]}</div><div style="font-size:30px;font-weight:800">${x[1]}</div><div style="font-size:24px;color:${M};margin-top:6px">${x[2]}</div></div>`).join('')}</div>
<div style="${fx(t,18)};margin-top:34px;padding-top:26px;border-top:2px solid ${B};font-size:34px;font-weight:800">Pass mark <span style="color:${O}">70%</span> on each part</div></div>`};
S.close=(t)=>`<div class="card" style="position:absolute;left:300px;right:300px;top:150px;padding:40px 50px;border-color:#F2C9AE;background:#FFF6EF;${fx(t,.3)}"><div class="k">SAFETY</div><div style="font-size:40px;font-weight:700;margin-top:16px;line-height:1.3">Simulated training builds real skill. It is not permission to work on live plant. Follow site rules and work under supervision.</div></div>
<div style="position:absolute;left:0;right:0;top:560px;text-align:center;${fx(t,11)}"><div class="k">UP NEXT · F1.1.1</div><h2 style="margin-top:14px">Why machines need <span style="color:${O}">controllers</span></h2>
<div style="margin-top:30px;display:inline-flex;align-items:center;gap:16px;font-size:30px;font-weight:700;color:${M}">${mark(56)} Setpoint Labs</div></div>`;
let caps={},CUES={};
window.setCaps=(c,q)=>{caps=c;CUES=q};
window.render=(sc,t,d)=>{document.getElementById('stage').innerHTML=S[sc](t,d);
const c=caps[sc]||[];let cur='';for(const x of c)if(t>=x[0])cur=x[1];const el=document.getElementById('cap');el.style.display=cur?'block':'none';el.textContent=cur;
document.querySelector('.code').style.opacity=sc==='title'?0:1};
</script></body></html>
