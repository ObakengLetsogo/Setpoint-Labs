# /etc/nginx/sites-available/setpoint  (then: ln -s ../sites-available/setpoint /etc/nginx/sites-enabled/)
# Replace setpointlabs.co.za if the final domain differs. Certbot adds the certificate lines.

limit_req_zone $binary_remote_addr zone=setpoint_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=setpoint_api:10m rate=20r/s;

upstream setpoint_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name setpointlabs.co.za www.setpointlabs.co.za;
    return 301 https://setpointlabs.co.za$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name setpointlabs.co.za;

    # ssl_certificate and ssl_certificate_key are written here by certbot --nginx.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/vtt;

    client_max_body_size 2m;

    # Built assets have content hashes in their names, so they can be cached for a year.
    location /_next/static/ {
        proxy_pass http://setpoint_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sign in, sign up and resets: a gentle per IP brake in front of the app's own limits.
    location ~ ^/(login|signup|forgot|reset)$ {
        limit_req zone=setpoint_auth burst=20 nodelay;
        proxy_pass http://setpoint_app;
        include /etc/nginx/snippets/setpoint-proxy.conf;
    }

    # Admin video uploads stream large files straight through to the app.
    location /api/admin/videos/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://setpoint_app;
        include /etc/nginx/snippets/setpoint-proxy.conf;
    }

    # Video bytes: the app checks the signed link, then hands the file to Nginx (VIDEO_ACCEL=1).
    location /_protected_videos/ {
        internal;
        alias /var/lib/setpoint/videos/;
        add_header Cache-Control "private, max-age=3600";
        mp4;
    }

    location /api/ {
        limit_req zone=setpoint_api burst=60 nodelay;
        proxy_pass http://setpoint_app;
        include /etc/nginx/snippets/setpoint-proxy.conf;
    }

    location / {
        proxy_pass http://setpoint_app;
        include /etc/nginx/snippets/setpoint-proxy.conf;
    }
}
